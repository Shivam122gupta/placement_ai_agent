# Enterprise-Grade Production Nginx Reverse Proxy Configuration
# Enforces TLS/HTTPS, strong ciphers, HSTS, security headers, and rate limiting

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version banner to prevent server enumeration
    server_tokens off;

    # Logging format with request timing and client IP
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Client payload size limit (matches backend 10MB max upload)
    client_max_body_size 15M;

    # Rate limiting zones for anti-DDoS, brute-force, AI abuse, and scraping protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=scraper_limit:10m rate=30r/m;

    # Map to identify automated scrapers, exploitation tools, and vulnerability scanners
    map $http_user_agent $bad_bot {
        default 0;
        ~*(sqlmap|nikto|wpscan|gobuster|dirbuster|nmap|masscan|zgrab|censys|shodan) 1;
        ~*(scrapy|mechanize|libwww-perl|python-requests|aiohttp) 1;
        ~*(headlesschrome|phantomjs|selenium|puppeteer|playwright) 1;
    }

    # SSL / TLS Settings - Modern Security Profile
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upstream backend container
    upstream backend_app {
        server backend:8000;
        keepalive 32;
    }

    # 1. HTTP Server - Strict Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME / Certbot challenge location for Let's Encrypt certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 301 Permanent Redirect all traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server - Hardened Application Endpoint
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates (mount from /etc/letsencrypt or custom volume)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Block known automated exploit bots and scrapers
        if ($bad_bot) {
            return 403 '{"error":{"code":"BOT_ACCESS_DENIED","message":"Automated access detected and restricted."}}';
        }

        # Strict rate limit on sensitive authentication endpoints
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Dedicated rate limit on AI Copilot generation requests
        location /api/v1/agent/ {
            limit_req zone=ai_limit burst=5 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Dedicated rate limit on AI Interview & Skill Gap generation
        location ~ ^/api/v1/(interviews|skill-gaps)/generate {
            limit_req zone=ai_limit burst=3 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Anti-scraping rate limit on job listings
        location /api/v1/jobs {
            limit_req zone=scraper_limit burst=10 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket support for Admin Live Feed (/api/v1/admin/ws)
        location /api/v1/admin/ws {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # General API proxy
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
