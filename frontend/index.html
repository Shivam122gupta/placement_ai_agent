<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/hirxora-logo-2.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/hirxora-logo-2.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090708" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hirxora" />
    <meta name="application-name" content="Hirxora" />
    <meta name="msapplication-TileColor" content="#090708" />
    <title>Hirxora — Autonomous Career & Placement Copilot</title>
    <meta name="description" content="Hirxora is an autonomous AI career copilot empowering students and job seekers with instant resume parsing, ATS scoring, JD matching, skill gap roadmaps, and realistic mock interview simulations." />
    <link rel="canonical" href="https://hirxora.ai/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hirxora.ai/" />
    <meta property="og:title" content="Hirxora — Autonomous Career & Placement Copilot" />
    <meta property="og:description" content="Land your dream tech offers faster with autonomous resume intelligence, personalized learning roadmaps, and AI mock interview arenas." />
    <meta property="og:image" content="/hirxora-logo-2.jpg" />
    <meta property="og:site_name" content="Hirxora" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hirxora.ai/" />
    <meta name="twitter:title" content="Hirxora — Autonomous Career & Placement Copilot" />
    <meta name="twitter:description" content="Land your dream tech offers faster with autonomous resume intelligence, personalized learning roadmaps, and AI mock interview arenas." />
    <meta name="twitter:image" content="/hirxora-logo-2.jpg" />

    <!-- Google Fonts: Plus Jakarta Sans, Newsreader & JetBrains Mono for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090708] text-[#FFF0EE] font-sans antialiased min-h-screen selection:bg-[#FF6B6B] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Hirxora PWA ServiceWorker registered with scope:', reg.scope))
            .catch((err) => console.warn('Hirxora PWA ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
